# 原有配置
dt: 0.002         # 物理步长，单位秒；保持模型原先实际使用的步长
render_mode: "human"  # 开启可视化！

# 预设摆动的位置增量速度（rad/s）；不是执行器控制指令。
demo_joint_speeds:
  shoulder_rot: 0.5
  elbow_flexion: 0.8
  pro_sup: 0.4

# 新增：面板选择任务配置
target_button: 0        # 目标按钮（可选0/1/2/3，对应红/绿/蓝/黄）
button_reward: 10.0     # 选对按钮的奖励值
effort_cost: 0.01       # 动作成本扣分系数（模型有执行器时生效）
timeout: 600            # 任务超时步数；600 × 0.002 = 1.2 秒仿真时间
